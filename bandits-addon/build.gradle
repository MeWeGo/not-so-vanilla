plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        // Loads the mod (plus any jars in run-gametest/mods) on a dedicated-server dist; no EULA file needed.
        packCheck { type = 'gameTestServer'; gameDirectory = project.file('run-gametest') }
        // Client smoke test with the full pack (jars in run-client/mods).
        packClient { client(); gameDirectory = project.file('run-client') }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    from("src/main/templates") { expand replaceProperties }
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { archiveBaseName = "${mod_id}-neoforge" }
